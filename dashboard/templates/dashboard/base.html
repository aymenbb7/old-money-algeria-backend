<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Money Algeria - Admin</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OMA Admin">
    <link rel="apple-touch-icon" href="/static/dashboard/images/icon-192.png">
    <link rel="manifest" href="/static/dashboard/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <style>
        :root {
            --bg-color: #0A0A0A;
            --card-color: #111111;
            --accent-gold: #D4AF37;
            --success-green: #0B4D2B;
            --text-main: #E0E0E0;
            --text-muted: #888888;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .brand-font {
            font-family: 'Playfair Display', serif;
        }

        /* Sidebar styling */
        .sidebar {
            width: 280px;
            background-color: var(--card-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            position: fixed;
            height: 100vh;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h2 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 1rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .menu-item i {
            margin-right: 1rem;
            width: 20px;
            text-align: center;
        }

        .menu-item:hover, .menu-item.active {
            background-color: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
            border-right: 3px solid var(--accent-gold);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            width: calc(100% - 280px);
            transition: margin-left 0.3s ease, width 0.3s ease;
        }

        .topbar {
            height: 70px;
            background-color: var(--card-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info button {
            background: none;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .user-info button:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
        }

        .content-area {
            padding: 2rem;
            flex: 1;
            overflow-y: auto;
        }

        /* Reusable Components */
        .card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .btn-gold {
            background-color: var(--accent-gold);
            color: var(--bg-color);
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-gold:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .status-badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-success { background-color: rgba(11, 77, 43, 0.2); color: #2e8b57; }
        .status-pending { background-color: rgba(212, 175, 55, 0.2); color: var(--accent-gold); }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.active {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .mobile-toggle {
                display: block;
            }
            /* Overlay */
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.5);
                z-index: 999;
            }
            .sidebar-overlay.active {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2 class="brand-font">OMA Admin</h2>
        </div>
        <div class="sidebar-menu">
            <a href="/admin/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_index' %}active{% endif %}"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="/admin/orders/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_orders' %}active{% endif %}"><i class="fas fa-shopping-bag"></i> Orders</a>
            <a href="/admin/products/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_products' %}active{% endif %}"><i class="fas fa-box"></i> Products</a>
            <a href="/admin/categories/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_categories' %}active{% endif %}"><i class="fas fa-tags"></i> Categories</a>
            <a href="/admin/homepage/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_homepage' %}active{% endif %}"><i class="fas fa-home"></i> Homepage</a>
            <a href="/admin/wilayas/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_wilayas' %}active{% endif %}"><i class="fas fa-map-marker-alt"></i> Wilayas & Delivery</a>
            <a href="/admin/coupons/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_coupons' %}active{% endif %}"><i class="fas fa-ticket-alt"></i> Coupons</a>
            <a href="/admin/settings/" class="menu-item {% if request.resolver_match.url_name == 'dashboard_settings' %}active{% endif %}"><i class="fas fa-cog"></i> Settings</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <button class="mobile-toggle" id="mobileToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="user-info">
                <span>Admin User</span>
                <button id="logoutBtn">Logout</button>
            </div>
        </header>

        <div class="content-area" id="contentArea">
            {% block content %}{% endblock %}
        </div>
    </main>

    {% include 'dashboard/notifications.html' %}
    <script>
        // ── Image upload helpers (Cloudflare R2 presigned PUT) ────────────────
        //
        // Flow: compress client-side → request presigned URL → PUT to R2 directly
        // Browser never sends image bytes through Django/Render.
        // Falls back to uploadViaServer when R2 is not configured (dev/local).

        /**
         * Resize + compress an image File using Canvas.
         * Returns a Blob (JPEG, max 1200px wide, quality 0.85).
         */
        async function compressImage(file, maxWidth = 1200, quality = 0.85) {
            return new Promise((resolve) => {
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    let { width, height } = img;
                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    canvas.toBlob(resolve, 'image/jpeg', quality);
                };
                img.onerror = () => resolve(file); // fallback: upload as-is
                img.src = objectUrl;
            });
        }

        /**
         * Upload a File to Cloudflare R2 via a server-issued presigned PUT URL.
         *
         * Steps:
         *  1. Compress to max 1200px JPEG (client-side, zero server load)
         *  2. POST {filename, content_type, size_bytes} to /api/v1/r2-presign/
         *     → backend validates and returns {upload_url, public_url, key}
         *  3. PUT compressed blob directly to R2 with XHR (real progress events)
         *  4. Resolve with public_url — the permanent URL to save in the database
         *
         * @param {File}     file       - The File/Blob selected by the user
         * @param {Function} onProgress - Callback with (percent: 0-100)
         * @returns {Promise<string>}   - Resolves to the permanent public image URL
         */
        async function uploadToStorage(file, onProgress) {
            // ── Step 1: client-side compression ──
            if (onProgress) onProgress(0);
            const compressed = await compressImage(file);

            // ── Step 2: request presigned URL ──
            let presignData;
            try {
                const presignRes = await fetch('/api/v1/r2-presign/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('oma_access_token')}`
                    },
                    body: JSON.stringify({
                        filename:     file.name,
                        content_type: 'image/jpeg',
                        size_bytes:   compressed.size
                    })
                });

                if (presignRes.status === 503) {
                    // R2 not configured on this server — use legacy path
                    console.warn('[upload] R2 not configured, falling back to server upload');
                    return uploadViaServer(compressed, onProgress);
                }
                if (presignRes.status === 401) {
                    throw new Error('Session expired — please log in again');
                }
                if (!presignRes.ok) {
                    const err = await presignRes.json().catch(() => ({}));
                    throw new Error(err.error || `Presign failed (${presignRes.status})`);
                }
                presignData = await presignRes.json();
            } catch (err) {
                // Network error (server unreachable, CORS, etc.) → fall back
                if (err.message.startsWith('Presign failed') || err.message.startsWith('Session')) throw err;
                console.warn('[upload] Presign network error, falling back:', err.message);
                return uploadViaServer(compressed, onProgress);
            }

            const { upload_url, public_url } = presignData;

            // ── Step 3: PUT blob directly to R2 ──
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('PUT', upload_url, true);
                xhr.setRequestHeader('Content-Type', 'image/jpeg');

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) {
                        onProgress(Math.round((e.loaded / e.total) * 100));
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(public_url);
                    } else {
                        reject(new Error(`R2 upload failed (HTTP ${xhr.status})`));
                    }
                };
                xhr.onerror = () => reject(new Error('Network error — upload to R2 failed'));
                xhr.send(compressed);
            });
        }

        // Backward-compat alias — products.html and settings.html call this name
        const uploadToCloudinary = uploadToStorage;

        /**
         * Legacy fallback: send image through /api/v1/upload-image/ (Cloudinary/local).
         * Only used in development or when R2 is not configured.
         */
        async function uploadViaServer(blob, onProgress) {
            const fd = new FormData();
            fd.append('image', blob, 'image.jpg');
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/v1/upload-image/', true);
                xhr.setRequestHeader('Authorization', `Bearer ${localStorage.getItem('oma_access_token')}`);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        resolve(JSON.parse(xhr.responseText).url);
                    } else {
                        reject(new Error('Server upload failed'));
                    }
                };
                xhr.onerror = () => reject(new Error('Network error'));
                xhr.send(fd);
            });
        }
    </script>
    <script>
        // Check Auth
        const token = localStorage.getItem('oma_access_token');
        if (!token && window.location.pathname !== '/admin/login/') {
            window.location.href = '/admin/login/';
        }

        // Mobile Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('mobileToggle');

        if(toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.add('active');
                overlay.classList.add('active');
            });
        }
        if(overlay) {
            overlay.addEventListener('click', () => {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
            });
        }

        // Logout
        const logoutBtn = document.getElementById('logoutBtn');
        if(logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('oma_access_token');
                localStorage.removeItem('oma_refresh_token');
                window.location.href = '/admin/login/';
            });
        }

        // API Helper
        async function apiCall(endpoint, method = 'GET', body = null) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${localStorage.getItem('oma_access_token')}`
            };
            const options = { method, headers };
            if (body) options.body = JSON.stringify(body);
            
            try {
                let res = await fetch(`/api/v1/${endpoint}`, options);
                if (res.status === 401) {
                    // Try to refresh token
                    const refresh = localStorage.getItem('oma_refresh_token');
                    if (refresh) {
                        const refRes = await fetch('/api/v1/auth/refresh/', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({refresh})
                        });
                        if (refRes.ok) {
                            const data = await refRes.json();
                            localStorage.setItem('oma_access_token', data.access);
                            options.headers['Authorization'] = `Bearer ${data.access}`;
                            res = await fetch(`/api/v1/${endpoint}`, options);
                        } else {
                            throw new Error("Session expired");
                        }
                    } else {
                        throw new Error("No refresh token");
                    }
                }
                return await res.json();
            } catch (err) {
                console.error(err);
                if (err.message === "Session expired" || err.message === "No refresh token") {
                    window.location.href = '/admin/login/';
                }
                return null;
            }
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
